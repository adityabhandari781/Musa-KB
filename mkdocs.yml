site_name: Musa's Gems
site_description: Structured knowledge extracted from Musa's content
site_url: https://adityabhandari781.github.io/Musa-KB/

repo_name: adityabhandari781/Musa-KB
repo_url: https://github.com/adityabhandari781/Musa-KB

docs_dir: kb

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search

extra_javascript:
  - javascripts/chat-config.js
  - javascripts/kb-chat.js

extra_css:
  - stylesheets/kb-chat.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
